# tools/imports.cfg -- gen_imports.py (runtime/tools): the modules whose imports
# the table serves, and the port's extra PASSTHROUGH / WEAK_NULL / DATA entries.
#
# FIFA 14 (com.ea.game.fifa14_row, armeabi-v7a), in DT_NEEDED order.
#
# libFIFA14.so imports 122 undefined EA::Nimble* symbols
#   (_ZN2EA6Nimble*, _ZNK2EA6Nimble*, one _ZTVN2EA6Nimble* vtable)
# that MUST NOT be stubbed. gen_imports.py leaves them out of dcr_imports[], and
# the loader binds them at run time to the exports of the REAL libnimble.so --
# which is why libnimble.so is one of the MODULES here and is loaded as a module
# (source/fifa14_main.c). Without a loaded libnimble.so those 122 imports stay
# unresolved and so_resolve() reports them.
#
# libnimble.so in turn imports libgnustl_shared.so's exports, so all three are
# scanned: each one's own libc/libm/libdl/liblog/libEGL/libGLESv2/gnustl imports
# must be served by the b_ shims like any port's.
MODULES libgnustl_shared.so libnimble.so libFIFA14.so

# --- added from the first `gen_imports.py --libs` run (this port) ------------
# Its 12 leftovers. Seven are config, five are code (source/fifa14_shims.c):
#
# ABI-compatible newlib functions (devkitARM's newlib wchar_t is 4 bytes, as
# bionic's; libc.a exports all six):
PASSTHROUGH isnan atoll wcscmp wcsncpy wcsstr
# bionic's char*[2] tzname -> newlib's _tzname (same layout, exported by libc.a):
DATA tzname _tzname
#
# Not config: __isinf, fwide and the three pthread attr/mutexattr calls are
# served by source/fifa14_shims.c as b___isinf, b_fwide,
# b_pthread_attr_setschedpolicy, b_pthread_attr_setstack,
# b_pthread_mutexattr_setpshared. Nothing is needed yet beyond these.
#
# wcstombs MOVED out of PASSTHROUGH: it is the engine's only wide (UTF-32) ->
# char conversion, so the port wraps it (b_wcstombs, source/fifa14_shims.c) to
# log the wide path the engine opens with -- the [fs] WIDE line. The wrapper
# calls newlib's wcstombs() itself, so the ABI is unchanged.
